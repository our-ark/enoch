name: evolve
version: 0.8.0
summary: Turn semantic evidence into bounded, human-governed self-evolution.
owner: Enoch
status: active
mode: co-evolution
entrypoint: src/enoch/evolution/core.py
capabilities:
  state: src/enoch/evolution/core.py
  evidence: src/enoch/evolution/evidence.py
  scheduler: src/enoch/evolution/core.py
  event_journal: src/enoch/evolution/events.py
  semantic_curation: src/enoch/evolution/curation.py
  candidate_collection:
    - src/enoch/evolution/evidence.py
    - src/enoch/learn.py
    - src/enoch/evolution/sources/brainstorming.py
  command_surface: src/enoch/app/core.py
permissions:
  filesystem:
    read:
      - .enoch/artifacts/logs/conversations
      - .enoch/artifacts/task_events.jsonl
      - .enoch/artifacts/evidence.jsonl
      - .enoch/artifacts/evidence_scans.jsonl
      - .enoch/artifacts/evolve_events.jsonl
      - .enoch/evolve_curations.jsonl
    write:
      - .enoch/evidence.json
      - .enoch/evolve.json
      - .enoch/evolve_candidates.json
      - .enoch/artifacts/evidence.jsonl
      - .enoch/artifacts/evidence_scans.jsonl
      - .enoch/artifacts/evolve_brainstorms.jsonl
      - .enoch/artifacts/evolve_events.jsonl
      - .enoch/evolve_curations.jsonl
  git:
    merge: false
validation:
  command: python3 -m unittest discover -s tests -t .
