[project]
name = "enoch"
version = "0.6.1"
description = "Enoch is a Genesis-created local agent."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pypdf==6.18.1",
  "our-ark-provider-kit @ git+https://github.com/our-ark/enoch.git@b34b62e7f31b3b1773242a0f92c7fcd5a0e0af61#subdirectory=libraries/provider-kit",
  "our-ark-skill-catalog @ git+https://github.com/our-ark/enoch.git@946ff26f93bff3f6eefeb5deb81ca4db1127266f#subdirectory=libraries/skill-catalog",
]

[project.optional-dependencies]
reference = [
  "our-ark-telegram @ git+https://github.com/our-ark/enoch.git@566b985f02923f97f96a614dd64b856e6aaa5897#subdirectory=libraries/telegram",
  "our-ark-slack @ git+https://github.com/our-ark/enoch.git@566b985f02923f97f96a614dd64b856e6aaa5897#subdirectory=libraries/slack",
  "our-ark-claude @ git+https://github.com/our-ark/enoch.git@566b985f02923f97f96a614dd64b856e6aaa5897#subdirectory=libraries/claude",
  "our-ark-github @ git+https://github.com/our-ark/enoch.git@566b985f02923f97f96a614dd64b856e6aaa5897#subdirectory=libraries/github",
  "our-ark-launchd @ git+https://github.com/our-ark/enoch.git@566b985f02923f97f96a614dd64b856e6aaa5897#subdirectory=libraries/launchd",
  "our-ark-systemd @ git+https://github.com/our-ark/enoch.git@566b985f02923f97f96a614dd64b856e6aaa5897#subdirectory=libraries/systemd",
  "our-ark-telegram-vision @ git+https://github.com/our-ark/enoch.git@6d894d9beb882af7e5f57900b2323361510262de#subdirectory=libraries/telegram-vision",
]

[project.scripts]
enoch = "enoch.cli:main"
enoch-agent = "enoch.app.core:main"
enoch-daemon = "enoch.operations.daemon:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enoch = ["body.yaml", "schemas/*.json"]
"enoch.skills" = ["**/*.md", "**/*.yaml"]
