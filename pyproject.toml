[project]
name = "enoch"
version = "0.7.0"
description = "Enoch is a Genesis-created local agent."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pypdf==6.21.4",
  "our-ark-provider-kit @ git+https://github.com/our-ark/enoch.git@d0898b9bd7d9be7a06f55c368f14e8a670e96433#subdirectory=libraries/provider-kit",
  "our-ark-skill-catalog @ git+https://github.com/our-ark/enoch.git@d0898b9bd7d9be7a06f55c368f14e8a670e96433#subdirectory=libraries/skill-catalog",
]

[project.optional-dependencies]
reference = [
  "our-ark-telegram @ git+https://github.com/our-ark/enoch.git@d0898b9bd7d9be7a06f55c368f14e8a670e96433#subdirectory=libraries/telegram",
  "our-ark-slack @ git+https://github.com/our-ark/enoch.git@d0898b9bd7d9be7a06f55c368f14e8a670e96433#subdirectory=libraries/slack",
  "our-ark-claude @ git+https://github.com/our-ark/enoch.git@d0898b9bd7d9be7a06f55c368f14e8a670e96433#subdirectory=libraries/claude",
  "our-ark-github @ git+https://github.com/our-ark/enoch.git@d0898b9bd7d9be7a06f55c368f14e8a670e96433#subdirectory=libraries/github",
  "our-ark-launchd @ git+https://github.com/our-ark/enoch.git@d0898b9bd7d9be7a06f55c368f14e8a670e96433#subdirectory=libraries/launchd",
  "our-ark-systemd @ git+https://github.com/our-ark/enoch.git@d0898b9bd7d9be7a06f55c368f14e8a670e96433#subdirectory=libraries/systemd",
  "our-ark-telegram-vision @ git+https://github.com/our-ark/enoch.git@d0898b9bd7d9be7a06f55c368f14e8a670e96433#subdirectory=libraries/telegram-vision",
]

[project.scripts]
enoch = "enoch.cli:main"
enoch-agent = "enoch.app.core:main"
enoch-daemon = "enoch.operations.daemon:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enoch = ["body.yaml", "schemas/*.json"]
"enoch.skills" = ["**/*.md", "**/*.yaml"]
