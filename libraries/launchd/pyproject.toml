[project]
name = "our-ark-launchd"
version = "0.1.1"
description = "macOS launchd service provider for Our Ark agents."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "our-ark-provider-kit @ git+https://github.com/our-ark/enoch.git@cdcff938ed8e74fb69ef6340ca0ec3951878b5fd#subdirectory=libraries/provider-kit",
]

[project.entry-points."our_ark.providers"]
"service.launchd" = "our_ark_launchd:create_provider"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
