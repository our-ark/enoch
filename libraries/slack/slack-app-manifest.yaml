display_information:
  name: Enoch
  description: A personal software agent you build for yourself.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Enoch
    always_online: true
  slash_commands:
    - command: /enoch
      description: Run an Enoch command.
      usage_hint: help, task, evolve, config, or another Enoch command
      should_escape: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
