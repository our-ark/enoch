[project]
name = "our-ark-claude"
version = "0.1.0"
description = "Agent-neutral Claude Code runtime provider for Our Ark agents."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "our-ark-provider-kit @ git+https://github.com/our-ark/enoch.git@b34b62e7f31b3b1773242a0f92c7fcd5a0e0af61#subdirectory=libraries/provider-kit",
]

[project.entry-points."our_ark.providers"]
"runtime.claude" = "our_ark_claude:create_provider"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
