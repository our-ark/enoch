[project]
name = "our-ark-claude"
version = "0.1.0"
description = "Agent-neutral Claude Code runtime provider for Our Ark agents."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "our-ark-provider-kit>=0.9",
]

[project.entry-points."our_ark.providers"]
"runtime.claude" = "our_ark_claude:create_provider"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
